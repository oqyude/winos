name: Update KVRT

# KVRT publishes daily dev builds at an unversioned "latest" URL, so Excavator
# cannot detect updates. This workflow fetches the current build and stamps the
# real version into bucket/kvrt.json (see scripts/update-kvrt.ps1).

on:
  workflow_dispatch:
  schedule:
    # 05:40 / 17:40 UTC - right after Kaspersky's usual ~05:07 build
    - cron: '40 5,17 * * *'

permissions:
  contents: write

jobs:
  update-kvrt:
    name: Update kvrt manifest
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest KVRT build
        id: kvrt
        shell: pwsh
        run: .\scripts\update-kvrt.ps1

      - name: Commit and push
        if: steps.kvrt.outputs.changed == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/kvrt.json
          git commit -m "kvrt: Update to version ${{ steps.kvrt.outputs.version }}"
          git push
