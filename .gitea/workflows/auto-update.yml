name: Auto-Update Bucket

# Walks bucket/*.json, checks each manifest's upstream via the GitHub Releases
# API, and applies version+url+hash updates via scripts/update-manifest.sh.
#
# Adapted from Dicklesworthstone/scoop-bucket (auto-update.yml). The original
# used a hard-coded matrix and repository_dispatch; this version iterates
# dynamically over bucket/ (so new manifests are picked up automatically) and
# drops the dispatch job because Gitea does not implement it. `git.zeroq.su`
# source repos cannot fire webhooks at this bucket anyway.
#
# Triggers:
#   schedule    - every 6 hours, checks every manifest with checkver.github
#   workflow_dispatch - manual run; loop runs as-is (re-checks all)
#
# Excludes:
#   kvrt.json        - has its own .gitea/workflows/update-kvrt.yml (kvrt.xml)
#   zapretcontrol*   - encoding issues, handled in a separate task

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"

jobs:
  check-updates:
    name: Check and apply bucket updates
    # `native` is the runner's LABEL, not its name: the runner registers with
    # `labels = [ "native:host" ]` (nixos: modules/server/gitea-runner.nix), and
    # Gitea matches `runs-on` against label names only. Using the runner name
    # `ci-sapphira` here matches nothing and falls back to a docker image this
    # host cannot run.
    runs-on: native
    env:
      # Gitea's per-job token, auto-injected as secrets.GITEA_TOKEN. Env var
      # names must avoid the reserved GITEA_/GITHUB_ prefixes, hence the
      # neutral name -- do not rename it back.
      OAUTH_TOKEN: ${{ secrets.GITEA_TOKEN }}
      # Optional GitHub PAT to lift the 60 req/h unauthenticated limit. Must be
      # a secret named GH_PAT: a GITHUB_TOKEN secret cannot be created (reserved
      # prefix), and the auto-injected GITHUB_TOKEN is a Gitea token that
      # api.github.com rejects with 401.
      GH_API_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Checkout repository
        # Gitea does NOT check the repository out on its own: the workspace
        # starts empty. Without this step the job died with
        # "bucket/ not found at /tmp/gitea-runner-work/<hash>" -- the script
        # looked for the manifests in a directory that never had them.
        #
        # Plain git instead of actions/checkout: the runner would have to
        # fetch the action from the instance (or from GitHub) and run it with
        # its own node runtime, and neither is guaranteed on this host-only
        # runner. git is on the runner's PATH (gitMinimal).
        env:
          # Same reserved-prefix rule as below: the value is the auto-injected
          # Gitea job token, the env var name may not start with GITEA_/GITHUB_.
          OAUTH_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -eu
          workdir="${GITHUB_WORKSPACE:-$PWD}"
          cd "$workdir"
          repo_url="https://oauth2:${OAUTH_TOKEN}@git.zeroq.su/oqyude/winos.git"
          if [[ -d .git ]]; then
            git remote set-url origin "$repo_url"
          else
            git init -q
            git remote add origin "$repo_url"
          fi
          ref="${GITHUB_REF:-}"
          if [[ -z "$ref" ]]; then
            # The runner always sets GITHUB_REF; this safety net resolves the
            # remote's default branch instead of guessing its name.
            default_ref="$(git ls-remote --symref origin HEAD 2>/dev/null \
              | sed -n 's|^ref: \(refs/[^[:space:]]*\).*|\1|p' | head -n1 || true)"
            ref="${default_ref:-refs/heads/master}"
          fi
          case "$ref" in
            refs/heads/*) branch="${ref#refs/heads/}" ;;
            *) branch="" ;;
          esac
          git fetch --depth=1 origin "$ref"
          if [[ -n "$branch" ]]; then
            git checkout -q -B "$branch" FETCH_HEAD
          else
            git checkout -q --detach FETCH_HEAD
          fi
          echo "checked out $ref ($(git rev-parse --short HEAD)) into $workdir"

      - name: Discover outdated manifests and update them
        id: discover
        run: |
          set -eu
          # Locate the repository root. The checkout step above puts the tree
          # in $GITHUB_WORKSPACE, but do not hard-code that: the runner's
          # workspace layout differs between versions, and guessing wrong is
          # exactly what broke this job. A repository root is recognised by
          # its bucket/ and scripts/ directories.
          find_repo_root() {
            local base cand
            for base in "${GITHUB_WORKSPACE:-}" "$PWD"; do
              [[ -n "$base" && -d "$base" ]] || continue
              for cand in "$base" "$base"/*/ "$base"/*/*/; do
                [[ -d "$cand/bucket" && -d "$cand/scripts" ]] || continue
                ( cd "$cand" && pwd )
                return 0
              done
            done
            return 1
          }

          if ! repo_root="$(find_repo_root)"; then
            echo "::error::bucket/ not found: no repository root under the workspace"
            echo "PWD=$PWD"
            echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-<unset>}"
            echo "GITHUB_REF=${GITHUB_REF:-<unset>}"
            echo "--- workspace listing ---"
            ls -la "${GITHUB_WORKSPACE:-$PWD}" || true
            exit 1
          fi
          cd "$repo_root"
          # Hand the root to the commit step instead of re-deriving it there.
          echo "repo_root=$repo_root" >> "$GITEA_OUTPUT"
          bucket_dir="$repo_root/bucket"

          GH_API="https://api.github.com"
          declare -a GH_AUTH=()
          if [[ -n "${GH_API_TOKEN:-}" ]]; then
            GH_AUTH=(-H "Authorization: token $GH_API_TOKEN")
          fi

          # JSON is parsed with python3, not jq: the runner's host PATH is
          # exactly nixos' hostPackages list (bash coreutils curl gawk
          # gitMinimal gnused nodejs wget nix python3 cacert) and jq is not
          # in it. Do not reintroduce jq -- the calls would fail with
          # "command not found" and every manifest would be skipped.

          declare -a UPDATED=()

          for manifest in "$bucket_dir"/*.json; do
            tool="$(basename "$manifest" .json)"

            # Excluded tools.
            case "$tool" in
              kvrt|zapretcontrol|zapretcontrol6)
                echo "::notice::$tool: skipped (custom update path)"
                continue
                ;;
            esac

            repo="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));v=(d.get("checkver") or {}).get("github") or "";sys.exit(1) if not v else print(v)' "$manifest")" || true
            check_url="$(python3 -c 'import json,sys;print((json.load(open(sys.argv[1])).get("checkver") or {}).get("url") or "")' "$manifest")"
            regex="$(python3 -c 'import json,sys;print((json.load(open(sys.argv[1])).get("checkver") or {}).get("regex") or "")' "$manifest")"

            current="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["version"])' "$manifest")"

            if [[ -n "$repo" ]]; then
              # GitHub: the version is a release tag. The release LIST, not
              # /releases/latest -- a repo may keep a rolling "latest" release
              # on top (INCY-DEV/incy-platforms does) and the single-release
              # endpoint then never exposes the versioned release. The list
              # comes newest first; scripts/pick-version.py picks the first
              # tag the regex matches.
              repo_path="${repo#https://github.com/}"
              if ! response="$(curl -fsSL "${GH_AUTH[@]}" "$GH_API/repos/$repo_path/releases?per_page=100")"; then
                echo "::warning::$tool: GitHub API call failed for $repo_path, skipping"
                continue
              fi
              latest="$(printf '%s' "$response" | python3 scripts/pick-version.py --tags "$regex" || true)"
            elif [[ -n "$check_url" ]]; then
              # Explicit source (e.g. a GitLab release API): the version is a
              # regex match in the response body.
              if ! response="$(curl -fsSL "${GH_AUTH[@]}" "$check_url")"; then
                echo "::warning::$tool: checkver.url request failed for $check_url, skipping"
                continue
              fi
              latest="$(printf '%s' "$response" | python3 scripts/pick-version.py --text "$regex" || true)"
            else
              echo "::notice::$tool: no checkver.github and no checkver.url, skipping"
              continue
            fi

            [[ -n "$latest" ]] || {
              echo "::warning::$tool: no version matched regex '${regex:-<none>}' for ${repo:-$check_url}, skipping"
              continue
            }

            echo "$tool: current=$current latest=$latest"
            if [[ "$current" == "$latest" ]]; then
              continue
            fi

            # `bash` in front of the script, not a direct call: the file is
            # checked out with the mode recorded in git, and a non-executable
            # bit would end the step with "Permission denied".
            if bash ./scripts/update-manifest.sh "$tool" "$latest"; then
              UPDATED+=("$tool $latest")
            else
              echo "::warning::$tool: update-manifest.sh failed; skipping"
            fi
          done

          # Emit a single-line summary for the next step and the run log.
          if [[ ${#UPDATED[@]} -eq 0 ]]; then
            echo "summary=none" >> "$GITEA_OUTPUT"
            echo "All manifests up to date."
            exit 0
          fi
          {
            echo "summary<<EOF"
            printf '  - %s\n' "${UPDATED[@]}"
            echo "EOF"
          } >> "$GITEA_OUTPUT"

      - name: Commit and push
        if: steps.discover.outputs.summary != 'none'
        env:
          # Reserved-prefix rule again: the value is the auto-injected Gitea
          # job token, the env var name may not start with GITEA_/GITHUB_.
          OAUTH_TOKEN: ${{ secrets.GITEA_TOKEN }}
          # Root of the checkout, resolved by the previous step.
          REPO_ROOT: ${{ steps.discover.outputs.repo_root }}
        run: |
          set -eu
          cd "${REPO_ROOT:-${GITHUB_WORKSPACE:-$PWD}}"
          [[ -d bucket ]] || { echo "::error::bucket/ not found at $PWD"; exit 1; }

          # `origin` is the only remote the runner's checkout creates; there
          # is no remote named `gitea`, so `set-url gitea` would abort the step
          # with "No such remote".
          git remote set-url origin \
            "https://oauth2:${OAUTH_TOKEN}@git.zeroq.su/oqyude/winos.git"
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.git.zeroq.su"

          if git diff --quiet bucket/; then
            echo "No changes after update (manifest hashes already matched)."
            exit 0
          fi

          # Stage the manifests. scripts/update-manifest.sh rewrites the files
          # in the working tree, and a commit without a staged change fails
          # with "no changes added to commit" -- the update would never reach
          # the remote.
          git add bucket/

          trigger="${{ gitea.event_name }}"
          summary="${{ steps.discover.outputs.summary }}"
          {
            echo "chore(bucket): auto-update [${trigger}]"
            echo "$summary"
          } | git commit -F -

          git push origin HEAD