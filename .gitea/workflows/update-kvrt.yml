name: Update KVRT

# KVRT publishes daily dev builds at an unversioned "latest" URL, so Excavator
# cannot detect updates. This workflow fetches the current build and stamps the
# real version into bucket/kvrt.json (see scripts/update-kvrt.ps1).
#
# Runs on the only available Gitea runner (ci-sapphira, host mode, NixOS).
# The `runs-on` value is the runner's LABEL, not its name -- see the comment
# on the job below. Gitea does not check the repository out on its own, so the
# job starts with an explicit checkout step.

on:
  workflow_dispatch:
  schedule:
    # 05:40 / 17:40 UTC - right after Kaspersky's usual ~05:07 build
    - cron: '40 5,17 * * *'

jobs:
  update-kvrt:
    name: Update kvrt manifest
    # `native` is the runner's LABEL, not its name: the runner registers with
    # `labels = [ "native:host" ]` (nixos: modules/server/gitea-runner.nix), and
    # Gitea matches `runs-on` against label names only. Using the runner name
    # `ci-sapphira` here matches nothing and falls back to a docker image this
    # host cannot run.
    runs-on: native
    steps:
      - name: Checkout repository
        # Gitea does NOT check the repository out on its own: the workspace
        # starts empty, so every path below ("scripts/update-kvrt.ps1",
        # "bucket/kvrt.json") would resolve against an empty directory.
        #
        # Plain git instead of actions/checkout: the runner would have to
        # fetch the action from the instance (or from GitHub) and run it with
        # its own node runtime, and neither is guaranteed on this host-only
        # runner. git is on the runner's PATH (gitMinimal).
        env:
          # Reserved-prefix rule: the value is the auto-injected Gitea job
          # token, the env var name may not start with GITEA_/GITHUB_.
          OAUTH_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -eu
          workdir="${GITHUB_WORKSPACE:-$PWD}"
          cd "$workdir"
          repo_url="https://oauth2:${OAUTH_TOKEN}@git.zeroq.su/oqyude/winos.git"
          if [[ -d .git ]]; then
            git remote set-url origin "$repo_url"
          else
            git init -q
            git remote add origin "$repo_url"
          fi
          ref="${GITHUB_REF:-}"
          if [[ -z "$ref" ]]; then
            # The runner always sets GITHUB_REF; this safety net resolves the
            # remote's default branch instead of guessing its name.
            default_ref="$(git ls-remote --symref origin HEAD 2>/dev/null \
              | sed -n 's|^ref: \(refs/[^[:space:]]*\).*|\1|p' | head -n1 || true)"
            ref="${default_ref:-refs/heads/master}"
          fi
          case "$ref" in
            refs/heads/*) branch="${ref#refs/heads/}" ;;
            *) branch="" ;;
          esac
          git fetch --depth=1 origin "$ref"
          if [[ -n "$branch" ]]; then
            git checkout -q -B "$branch" FETCH_HEAD
          else
            git checkout -q --detach FETCH_HEAD
          fi
          echo "checked out $ref ($(git rev-parse --short HEAD)) into $workdir"

      - name: Fetch latest KVRT build
        id: kvrt
        # pwsh is on PATH on ci-sapphira; nix-shell is a fallback if the path
        # ever changes. scripts/update-kvrt.ps1 writes outputs to either
        # $GITEA_OUTPUT or $GITHUB_OUTPUT depending on which the runner sets.
        run: |
          set -eu
          # Locate the repository root: the checkout step above puts the tree
          # in $GITHUB_WORKSPACE, but the runner's workspace layout differs
          # between versions, so do not hard-code it. A repository root is
          # recognised by its bucket/ and scripts/ directories.
          find_repo_root() {
            local base cand
            for base in "${GITHUB_WORKSPACE:-}" "$PWD"; do
              [[ -n "$base" && -d "$base" ]] || continue
              for cand in "$base" "$base"/*/ "$base"/*/*/; do
                [[ -d "$cand/bucket" && -d "$cand/scripts" ]] || continue
                ( cd "$cand" && pwd )
                return 0
              done
            done
            return 1
          }

          if ! repo_root="$(find_repo_root)"; then
            echo "::error::bucket/ not found: no repository root under the workspace"
            echo "PWD=$PWD"
            echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-<unset>}"
            echo "GITHUB_REF=${GITHUB_REF:-<unset>}"
            echo "--- workspace listing ---"
            ls -la "${GITHUB_WORKSPACE:-$PWD}" || true
            exit 1
          fi
          cd "$repo_root"
          # Hand the root to the commit step instead of re-deriving it there.
          echo "repo_root=$repo_root" >> "$GITEA_OUTPUT"

          # pwsh is not in the runner's PATH: the runner's hostPackages are
          # frozen into its systemd unit at activation time, and changing them
          # needs a nixos-rebuild on the host. The `ci` devshell of the nixos
          # repo carries the same tool set and can be entered without one --
          # take its PATH for the rest of the step.
          nixos_flake="${NIXOS_FLAKE:-/etc/nixos}"
          if ci_path="$(nix develop "path:$nixos_flake"#ci --command bash -c 'printf %s "$PATH"')"; then
            export PATH="$ci_path:$PATH"
            echo "ci devshell: $nixos_flake#ci"
          else
            echo "::warning::could not enter $nixos_flake#ci -- pwsh may be missing"
          fi

          command -v pwsh >/dev/null 2>&1 || {
            echo "::error::pwsh not found in PATH"
            exit 1
          }
          pwsh -NoProfile -File ./scripts/update-kvrt.ps1

      - name: Commit and push
        if: steps.kvrt.outputs.changed == 'true'
        env:
          # Reserved-prefix rule: the value is the auto-injected Gitea job
          # token, the env var name may not start with GITEA_/GITHUB_.
          OAUTH_TOKEN: ${{ secrets.GITEA_TOKEN }}
          # Root of the checkout, resolved by the previous step.
          REPO_ROOT: ${{ steps.kvrt.outputs.repo_root }}
        run: |
          set -eu
          cd "${REPO_ROOT:-${GITHUB_WORKSPACE:-$PWD}}"
          [[ -d bucket ]] || { echo "::error::bucket/ not found at $PWD"; exit 1; }
          # `origin` is the only remote the runner's checkout creates; there
          # is no remote named `gitea`, so `set-url gitea` would abort the step
          # with "No such remote".
          git remote set-url origin \
            "https://oauth2:${OAUTH_TOKEN}@git.zeroq.su/oqyude/winos.git"
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.git.zeroq.su"
          git add bucket/kvrt.json
          git commit -m "kvrt: Update to version ${{ steps.kvrt.outputs.version }}"
          git push origin HEAD